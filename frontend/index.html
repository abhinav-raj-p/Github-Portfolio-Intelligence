<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Portfolio Intelligence</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>GitHub Portfolio Intelligence</h1>
            <p>Analyze your GitHub profile or search for candidates.</p>
        </header>

        <div id="login-section" class="card">
            <h2>Select Role & Login</h2>
            <div class="roles">
                <label>
                    <input type="radio" name="role" value="aspirant" checked> Aspirant (Analyze My Profile)
                </label>
                <label>
                    <input type="radio" name="role" value="recruiter"> Recruiter (Search Candidates)
                </label>
            </div>
            <a href="/auth/github" class="btn">Login with GitHub</a>
        </div>

        <div id="dashboard-section" class="card" style="display:none;">
            <div class="header-split">
                <h2>Dashboard</h2>
                <a href="/auth/logout" class="btn btn-outline">Logout</a>
            </div>
            
            <div id="search-section" style="display:none; margin-bottom: 20px;">
                <input type="text" id="candidate-username" placeholder="Enter GitHub Username to analyze...">
                <button id="search-btn" class="btn">Analyze Candidate</button>
            </div>

            <div id="results" class="results-box">
                <!-- Data will be injected here -->
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
