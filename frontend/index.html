<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Portfolio Intelligence</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>GitHub Portfolio Intelligence</h1>
            <p>Analyze your GitHub profile or search for candidates.</p>
        </header>

        <div id="login-section" class="card">
            <h2>Select Role & Login</h2>
            <div class="roles">
                <label>
                    <input type="radio" name="role" value="aspirant" checked> Aspirant (Analyze My Profile)
                </label>
                <label>
                    <input type="radio" name="role" value="recruiter"> Recruiter (Search Candidates)
                </label>
            </div>
            <a href="/auth/github" class="btn">Login with GitHub</a>
        </div>

        <div id="dashboard-section" style="display:none;">
            <div class="header-split">
                <h2>Dashboard</h2>
                <div class="header-actions">
                    <button id="view-favorites-btn" class="btn btn-outline"
                        style="display:none; margin-right: 10px;">Saved Candidates</button>
                    <a href="/auth/logout" class="btn btn-outline">Logout</a>
                </div>
            </div>

            <div id="favorites-section" class="card" style="display:none; margin-bottom: 20px;">
                <h3>Saved Candidates</h3>
                <div id="favorites-list">
                    <!-- Favorites injected here -->
                </div>
                <button id="close-favorites-btn" class="btn btn-outline" style="margin-top: 15px;">Close</button>
            </div>

            <div id="search-section" class="card" style="display:none; margin-bottom: 20px;">
                <input type="text" id="candidate-username" placeholder="Enter GitHub Username to analyze...">
                <button id="search-btn" class="btn">Analyze Candidate</button>
            </div>

            <div id="results" class="results-box card" style="display:none;">
                <!-- Data will be injected here -->
            </div>
        </div>
    </div>

    <!-- Modal for Commits -->
    <div id="commits-modal" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <button class="close-modal" id="close-commits-modal">&times;</button>
            <h3 style="color:var(--accent-peach);">Recent Commits: <span id="modal-repo-name"></span></h3>
            <div id="commits-list">
                Loading...
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
